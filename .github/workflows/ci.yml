name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SpazaHub.sln

      - name: Build
        run: dotnet build SpazaHub.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SpazaHub.sln --no-build --configuration Release --verbosity normal
