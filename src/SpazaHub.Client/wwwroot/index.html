<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpazaHub</title>
    <base href="/" />
    <link rel="preload" href="fonts/archivo-black-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <meta name="theme-color" content="#20262e" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SpazaHub.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="update-bar">
        <span>New version ready</span>
        <button type="button">Update now</button>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/notifications.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
            reg.update();
            var bar = document.getElementById('update-bar');
            function offerUpdate(worker) {
                if (!worker) { return; }
                bar.style.display = 'flex';
                bar.querySelector('button').onclick = function () {
                    worker.postMessage({ type: 'SKIP_WAITING' });
                };
            }
            if (reg.waiting) { offerUpdate(reg.waiting); }
            reg.addEventListener('updatefound', function () {
                var installing = reg.installing;
                if (!installing) { return; }
                installing.addEventListener('statechange', function () {
                    if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                        offerUpdate(reg.waiting || installing);
                    }
                });
            });
            var reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!reloaded) { reloaded = true; location.reload(); }
            });
        });
    </script>
</body>

</html>
